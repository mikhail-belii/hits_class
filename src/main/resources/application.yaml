logging:
  level:
    # Покажет все бины и их зависимости
    org.springframework.beans.factory.support.DefaultListableBeanFactory: DEBUG

    # Покажет процесс создания бинов
    org.springframework.beans.factory: DEBUG

    # Покажет циклические зависимости
    org.springframework.context.annotation: DEBUG

    # Для Spring Boot
    org.springframework.boot: DEBUG
spring:
  main:
    allow-circular-references: true
  config:
    import: optional:file:.env[.properties]
  application:
    name: HitsClass
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hits_class_db}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
      ddl-auto: none
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

jwt:
  secret:
    access: dmVyeS1zdHJvbmctc2VjcmV0LWZvci1hY2Nlc3MtdG9rZW4tMDAx
    refresh: dmVyeS1zdHJvbmctc2VjcmV0LWZvci1yZWZyZXNoLXRva2VuLTAwMg==
  lifetime:
    access-minutes: 50
    refresh-days: 30

file-storage-root: ${FILE_STORAGE_ROOT:files/uploads}
